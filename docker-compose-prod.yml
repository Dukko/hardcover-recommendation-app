version: '3.8'

services:
  hardcover-ai-librarian:

    image: dukkokun/hardcover-ai-librarian:latest
      
    ports:
      - "8501:8501"
     
    environment:
      # Simple env vars that entrypoint.sh will read
      - HARDCOVER_TOKEN=${HARDCOVER_TOKEN}
      - GEMINI_KEY=${GEMINI_KEY}
      - OPENAI_KEY=${OPENAI_KEY}
      - ANTHROPIC_KEY=${ANTHROPIC_KEY}
    
    # Restart automatically if it crashes
    restart: unless-stopped
    
    # Clean container name
    container_name: hardcover-ai-librarian